name: api-coverage

on:
  pull_request:
    paths:
      - 'apps/api-server/**'
      - 'packages/**'
      - '.github/workflows/api-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api-server/**'
      - 'packages/**'

jobs:
  unit-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        working-directory: .
        run: npm ci
      - name: Generate Prisma clients
        run: npm run prisma:generate
      - name: Unit tests + coverage (>=75% lines)
        run: npm run test:cov:check

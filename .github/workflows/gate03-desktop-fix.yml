name: gate03-desktop-fix
on:
  push:
    branches: [fix/gate-0.3-metadata-side-channel-v2]
    paths:
      - patches/gate03-desktop.patch
      - .github/workflows/gate03-desktop-fix.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gate-0.3-metadata-side-channel-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore main.ts from main and apply Gate 0.3 patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:apps/desktop/src/main.ts > apps/desktop/src/main.ts
          git apply --verbose patches/gate03-desktop.patch
          grep -n "TEXT_BEARING_EVENT_TYPES" apps/desktop/src/main.ts | head
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(gate-0.3): desktop strip metadata.value on non-text events"
          git push origin HEAD:fix/gate-0.3-metadata-side-channel-v2
